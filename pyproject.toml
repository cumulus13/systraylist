[build-system]
requires = [
    "setuptools>=61",
]
build-backend = "setuptools.build_meta"

[project]
name = "systraylist"
version = "0.1.6"
description = "List Windows systray icons and activate one by number"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Hadi Cahyadi", email = "cumulus13@gmail.com" },
]
dependencies = [
    "pywinauto>=0.6.8",
    "pywin32",
    "psutil",
]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/cumulus13/systraylist"

[project.scripts]
systraylist = "systraylist.systraylist:main"

[tool.setuptools]
packages = [
    "systraylist",
]
