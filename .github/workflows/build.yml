name: build-exe

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install . pyinstaller

      - name: Build exe
        run: >
          pyinstaller --onefile --name systraylist
          --collect-all pywinauto --collect-all comtypes
          --hidden-import systraylist.host --hidden-import win32timezone
          run.py

      - name: Build exe (admin manifest)
        run: >
          pyinstaller --onefile --name systraylist-admin --uac-admin
          --collect-all pywinauto --collect-all comtypes
          --hidden-import systraylist.host --hidden-import win32timezone
          run.py

      - name: Smoke test
        run: ./dist/systraylist.exe -l
        continue-on-error: true

      - name: Checksums
        shell: pwsh
        run: |
          cd dist
          Get-FileHash *.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: systraylist-windows
          path: |
            dist/*.exe
            dist/SHA256SUMS.txt

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
